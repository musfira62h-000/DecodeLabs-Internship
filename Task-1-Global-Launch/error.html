<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 &middot; Access Denied | Musfira Hassan</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Space Grotesk", system-ui, sans-serif;
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      color: #e6edf7; padding: 24px;
      background:
        radial-gradient(1000px 500px at 70% -10%, rgba(34,211,238,0.16), transparent 60%),
        linear-gradient(180deg, #060a14, #070c18);
    }
    .code {
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(5rem, 20vw, 9rem); font-weight: 700; line-height: 1;
      background: linear-gradient(120deg, #38bdf8, #34d399);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    h1 { font-size: 1.7rem; margin: 12px 0 8px; }
    p { color: #93a1bd; max-width: 440px; margin: 0 auto 28px; font-family: "JetBrains Mono", monospace; font-size: 0.9rem; }
    a {
      display: inline-block; background: linear-gradient(135deg, #38bdf8, #34d399);
      color: #06131a; font-weight: 600; padding: 12px 26px; border-radius: 10px; text-decoration: none;
    }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Access Denied &mdash; page not found</h1>
    <p>// the resource you requested doesn't exist or has been moved</p>
    <a href="/index.html">&larr; return to home</a>
  </div>
</body>
</html>
